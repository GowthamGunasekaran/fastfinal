# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = alembic

# sys.path path, prepended to sys.path
prepend_sys_path = .

# Default URL (overridden dynamically in env.py from app.db.database.DATABASE_URL)
sqlalchemy.url = sqlite:///./national_one_pager.db

[post_write_hooks]

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
